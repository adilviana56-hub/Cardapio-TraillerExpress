<script>
    const socket = io();
    let lojaAberta = true;
    let cardapioAtual = [];
    let pedidosAtuais = [];
    let pedidosHistoricoGeral = []; 
    let chartInstancia = null;

    // Alternar visibilidade das datas customizadas
    document.getElementById('filtro-periodo').addEventListener('change', function() {
      const blocoCustom = document.getElementById('bloco-datas-custom');
      if (this.value === 'custom') {
        blocoCustom.style.display = 'flex';
      } else {
        blocoCustom.style.display = 'none';
        carregarRelatorioFinanceiro();
      }
    });

    // NAVEGAÇÃO 3 ABAS
    function trocarAba(aba) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (aba === 'pedidos') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-pedidos').classList.add('active');
      } else if (aba === 'cardapio') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-cardapio').classList.add('active');
      } else if (aba === 'financeiro') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('tab-financeiro').classList.add('active');
        carregarRelatorioFinanceiro();
      }
    }

    // BUSCAR DADOS FINANCEIROS NO SUPABASE
    function carregarRelatorioFinanceiro() {
      const filtro = document.getElementById('filtro-periodo').value;
      let payload = { filtro };

      if (filtro === 'custom') {
        payload.dataInicio = document.getElementById('filtro-data-inicio').value;
        payload.dataFim = document.getElementById('filtro-data-fim').value;
      }

      socket.emit('obterRelatorioFinanceiro', payload);
    }

    // OUVIR RESPOSTA DO BANCO DE DADOS E RENDERIZAR MÉTRICAS / GRÁFICOS
    socket.on('respostaRelatorioFinanceiro', (data) => {
      const resumo = data.resumo || {};
      pedidosHistoricoGeral = data.pedidos || [];

      const faturamentoTotal = parseFloat(resumo.faturamento_total || 0);
      const totalProdutos = parseFloat(resumo.total_produtos || 0);
      const totalTaxas = parseFloat(resumo.total_taxas || 0);
      const qtdPedidos = parseInt(resumo.qtd_pedidos || 0, 10);

      document.getElementById('fin-faturamento').innerText = `R$ ${faturamentoTotal.toFixed(2).replace('.', ',')}`;
      document.getElementById('fin-produtos').innerText = `R$ ${totalProdutos.toFixed(2).replace('.', ',')}`;
      document.getElementById('fin-taxas').innerText = `R$ ${totalTaxas.toFixed(2).replace('.', ',')}`;
      document.getElementById('fin-qtd').innerText = qtdPedidos;

      const corpo = document.getElementById('tabela-relatorio-corpo');
      if (pedidosHistoricoGeral.length === 0) {
        corpo.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">Nenhum pedido encontrado no período selecionado.</td></tr>';
      } else {
        corpo.innerHTML = '';
        pedidosHistoricoGeral.forEach(p => {
          const idStr = String(p.id || '');
          corpo.innerHTML += `
            <tr>
              <td>${p.data_formatada || '-'}</td>
              <td>#${idStr ? idStr.slice(-4) : '---'}</td>
              <td>${p.cliente || 'Cliente'}</td>
              <td>${(p.tipo_entrega || 'entrega').toUpperCase()}</td>
              <td>${(p.pagamento || '-').toUpperCase()}</td>
              <td><strong>R$ ${Number(p.total || 0).toFixed(2).replace('.', ',')}</strong></td>
              <td style="text-align: center; white-space: nowrap;">
                <button class="btn btn-imprimir" style="padding: 4px 8px; font-size: 12px;" onclick="imprimirPedidoHistorico('${idStr}')">🖨️</button>
                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="excluirVendaHistorico('${idStr}')">🗑️</button>
              </td>
            </tr>
          `;
        });
      }

      processarAnalytcs(pedidosHistoricoGeral);
    });

    // EXCLUIR REGISTRO DE VENDA/TESTE DO HISTÓRICO
    function excluirVendaHistorico(id) {
      const idStr = String(id);
      if (confirm(`Deseja realmente excluir permanentemente a venda #${idStr.slice(-4)} do histórico financeiro?`)) {
        socket.emit('excluirVendaHistorico', id);
        carregarRelatorioFinanceiro();
      }
    }

    // IMPRIMIR PEDIDO DO RELATÓRIO HISTÓRICO
    function imprimirPedidoHistorico(id) {
      const p = pedidosHistoricoGeral.find(item => String(item.id) === String(id));
      if (!p) return alert('Pedido não encontrado no histórico!');
      executarImpressaoTermica(p);
    }

    // IMPRIMIR PEDIDO DA ABA DE PEDIDOS ATIVOS
    function imprimirPedido(id) {
      const p = pedidosAtuais.find(item => String(item.id) === String(id));
      if (!p) return alert('Pedido ativo não encontrado!');
      executarImpressaoTermica(p);
    }

    // FUNÇÃO CENTRALIZADA DE GERAÇÃO DO CUPOM TÉRMICO
    function executarImpressaoTermica(p) {
      const area = document.getElementById('area-impressao-termica');
      area.style.display = 'block';

      const idStr = String(p.id || '');
      let itensFormatados = p.itens ? p.itens.map(i => `
        <div class="item-cupom">
          <strong>${i.quantidade}x</strong> ${i.nome}
        </div>
      `).join('') : '';

      area.innerHTML = `
        <h2>TRAILER EXPRESS</h2>
        <div style="text-align: center; font-size: 10px;">Comprovante de Pedido</div>
        <div class="divisoria"></div>
        <p><strong>PEDIDO:</strong> #${idStr ? idStr.slice(-4) : '---'} - ${p.data_formatada || p.data || ''}</p>
        <p><strong>CLIENTE:</strong> ${p.cliente || 'Cliente'}</p>
        ${p.whatsapp || p.telefone ? `<p><strong>TEL:</strong> ${p.whatsapp || p.telefone}</p>` : ''}
        <p><strong>ENDEREÇO:</strong> ${p.endereco || p.tipo_entrega || 'Retirada'}</p>
        <div class="divisoria"></div>
        <p><strong>ITENS SOLICITADOS:</strong></p>
        ${itensFormatados}
        <div class="divisoria"></div>
        <p><strong>PAGAMENTO:</strong> ${(p.pagamento || '').toUpperCase()}</p>
        ${p.troco ? `<p><strong>TROCO PARA:</strong> R$ ${p.troco}</p>` : ''}
        <p style="font-size: 14px; margin-top: 4px;"><strong>TOTAL: R$ ${Number(p.total || 0).toFixed(2).replace('.', ',')}</strong></p>
        ${p.observacao ? `<div class="divisoria"></div><p><strong>OBS:</strong> ${p.observacao}</p>` : ''}
        <div class="divisoria"></div>
        <div style="text-align: center; font-size: 10px; margin-top: 8px;">Obrigado pela preferência! 🍔</div>
      `;

      window.print();

      setTimeout(() => {
        area.style.display = 'none';
      }, 1000);
    }

    // PROCESSAR RANKING E GRÁFICO
    function processarAnalytcs(pedidos) {
      const contagemProdutos = {};
      const faturamentoPorDia = {};

      pedidos.forEach(p => {
        const dataDia = p.data_formatada ? p.data_formatada.split(' ')[0] : 'Desconhecido';
        const valorTotal = parseFloat(p.total || 0);
        faturamentoPorDia[dataDia] = (faturamentoPorDia[dataDia] || 0) + valorTotal;

        if (p.itens && Array.isArray(p.itens)) {
          p.itens.forEach(item => {
            const nomeItem = item.nome || 'Produto';
            const qtdItem = parseInt(item.quantidade || 1, 10);
            contagemProdutos[nomeItem] = (contagemProdutos[nomeItem] || 0) + qtdItem;
          });
        }
      });

      const rankingDiv = document.getElementById('ranking-produtos');
      const produtosOrdenados = Object.entries(contagemProdutos).sort((a, b) => b[1] - a[1]);

      if (produtosOrdenados.length === 0) {
        rankingDiv.innerHTML = '<p style="color: #888; text-align: center; margin-top: 40px;">Nenhum dado de itens vendidos no período.</p>';
      } else {
        let htmlRanking = '<table style="width: 100%; border-collapse: collapse;">';
        htmlRanking += '<tr style="background: #f1f3f5; text-align: left;"><th style="padding: 6px; border-bottom: 1px solid #ddd;">Produto / Bebida</th><th style="padding: 6px; border-bottom: 1px solid #ddd; text-align: right;">Qtd</th></tr>';
        
        produtosOrdenados.forEach(([nome, qtd], index) => {
          htmlRanking += `<tr>
            <td style="padding: 6px; border-bottom: 1px solid #eee;">${index + 1}. ${nome}</td>
            <td style="padding: 6px; border-bottom: 1px solid #eee; text-align: right; font-weight: bold; color: #cc0000;">${qtd}x</td>
          </tr>`;
        });
        htmlRanking += '</table>';
        rankingDiv.innerHTML = htmlRanking;
      }

      const diasOrdenados = Object.keys(faturamentoPorDia).sort();
      const valoresDias = diasOrdenados.map(d => faturamentoPorDia[d]);

      const ctx = document.getElementById('graficoVendas').getContext('2d');
      if (chartInstancia) {
        chartInstancia.destroy();
      }

      chartInstancia = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: diasOrdenados.length > 0 ? diasOrdenados : ['Sem dados'],
          datasets: [{
            label: 'Faturamento (R$)',
            data: valoresDias.length > 0 ? valoresDias : [0],
            backgroundColor: 'rgba(204, 0, 0, 0.7)',
            borderColor: 'rgba(204, 0, 0, 1)',
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return 'R$ ' + value.toFixed(2);
                }
              }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function produtoEstaAtivo(p) {
      if (p.ativo === false || p.disponivel === false) return false;
      return true;
    }

    socket.on('atualizarEstado', (data) => {
      lojaAberta = data.lojaAberta;
      cardapioAtual = data.cardapio || [];
      atualizarBotaoLoja();
      renderizarCardapio();
      atualizarSelectCategorias();
    });

    socket.on('carregarPedidos', (pedidos) => {
      pedidosAtuais = pedidos || [];
      renderizarPedidos(pedidosAtuais);
    });

    socket.on('atualizarListaPedidos', (pedidos) => {
      pedidosAtuais = pedidos || [];
      renderizarPedidos(pedidosAtuais);
    });

    socket.on('novoPedido', (pedido) => {
      try {
        const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        audio.play().catch(() => {});
      } catch (e) {}

      if (document.getElementById('tab-financeiro').classList.contains('active')) {
        carregarRelatorioFinanceiro();
      }
    });

    function alternarStatusLoja() {
      socket.emit('mudarStatusLoja', !lojaAberta);
    }

    function atualizarBotaoLoja() {
      const btn = document.getElementById('btn-toggle-loja');
      if (lojaAberta) {
        btn.innerText = "● LOJA ABERTA";
        btn.className = "btn-status btn-aberto";
      } else {
        btn.innerText = "● LOJA FECHADA";
        btn.className = "btn-status btn-fechado";
      }
    }

    function atualizarSelectCategorias() {
      const select = document.getElementById('prod-categoria');
      select.innerHTML = '<option value="">Selecione a Categoria...</option>';
      cardapioAtual.forEach(c => {
        select.innerHTML += `<option value="${c.categoria}">${c.categoria}</option>`;
      });
    }

    function renderizarCardapio() {
      const container = document.getElementById('container-cardapio');
      container.innerHTML = '';

      if (!cardapioAtual || cardapioAtual.length === 0) {
        container.innerHTML = '<p style="color:#888;">Nenhuma categoria cadastrada.</p>';
        return;
      }

      cardapioAtual.forEach(cat => {
        const listaProdutos = cat.produtos || cat.itens || [];

        let html = `
          <div class="cat-box">
            <div class="cat-header">
              <h3>${cat.categoria}</h3>
              <div>
                <button class="btn btn-warning" style="padding: 4px 8px; font-size: 12px;" onclick="editarCategoria('${(cat.categoria || '').replace(/'/g, "\\'")}')">✏️ Editar Nome</button>
                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="excluirCategoria('${(cat.categoria || '').replace(/'/g, "\\'")}')">🗑️ Excluir</button>
              </div>
            </div>
        `;

        if (listaProdutos.length === 0) {
          html += `<p style="font-size: 13px; color: #999;">Nenhum produto nesta categoria.</p>`;
        } else {
          listaProdutos.forEach(p => {
            const ativo = produtoEstaAtivo(p);
            const nomeEscapado = (p.nome || '').replace(/'/g, "\\'");
            const descEscapada = (p.descricao || '').replace(/'/g, "\\'");
            const preco = Number(p.preco || 0);

            html += `
              <div class="item-produto">
                <div class="item-info">
                  <strong>${p.nome}</strong> - <span style="color:#28a745; font-weight:bold;">R$ ${preco.toFixed(2).replace('.', ',')}</span>
                  <p>${p.descricao || 'Sem descrição'}</p>
                </div>
                <div class="item-acoes">
                  <button class="btn btn-warning" style="padding: 5px 8px; font-size: 12px;" onclick="editarProduto(${p.id}, '${nomeEscapado}', ${preco}, '${descEscapada}')">✏️ Editar</button>
                  <button class="btn ${ativo ? 'btn-sucesso' : 'btn-danger'}" style="padding: 5px 8px; font-size: 12px;" onclick="toggleProduto(${p.id}, ${!ativo})">
                    ${ativo ? 'Disponível' : 'Esgotado'}
                  </button>
                  <button class="btn btn-danger" style="padding: 5px 8px; font-size: 12px;" onclick="excluirProduto(${p.id})">🗑️</button>
                </div>
              </div>
            `;
          });
        }

        html += `</div>`;
        container.innerHTML += html;
      });
    }

    function adicionarCategoria() {
      const input = document.getElementById('nova-categoria-nome');
      if (input.value.trim()) {
        socket.emit('adicionarCategoria', input.value.trim());
        input.value = '';
      }
    }

    function editarCategoria(nomeAntigo) {
      const novoNome = prompt("Digite o novo nome para a categoria:", nomeAntigo);
      if (novoNome && novoNome.trim()) {
        socket.emit('editarCategoria', { nomeAntigo, novoNome: novoNome.trim() });
      }
    }

    function excluirCategoria(nomeCategoria) {
      if (confirm(`Excluir a categoria "${nomeCategoria}" e todos os seus produtos?`)) {
        socket.emit('excluirCategoria', nomeCategoria);
      }
    }

    function adicionarProduto() {
      const categoria = document.getElementById('prod-categoria').value;
      const nome = document.getElementById('prod-nome').value.trim();
      const preco = document.getElementById('prod-preco').value;
      const descricao = document.getElementById('prod-descricao').value.trim();

      if (!categoria || !nome || !preco) {
        return alert('Preencha a Categoria, Nome e Preço!');
      }

      socket.emit('adicionarProduto', { categoria, nome, preco: parseFloat(preco), descricao, ativo: true, disponivel: true });

      document.getElementById('prod-nome').value = '';
      document.getElementById('prod-preco').value = '';
      document.getElementById('prod-descricao').value = '';
    }

    function editarProduto(idProduto, nomeAtual, precoAtual, descAtual) {
      const novoNome = prompt("Nome do Produto:", nomeAtual);
      if (novoNome === null) return;

      const novoPrecoStr = prompt("Preço (R$):", precoAtual);
      if (novoPrecoStr === null) return;
      const novoPreco = parseFloat(novoPrecoStr.replace(',', '.'));

      const novaDesc = prompt("Descrição:", descAtual);
      if (novaDesc === null) return;

      if (!novoNome.trim() || isNaN(novoPreco)) {
        return alert("Nome ou Preço inválidos!");
      }

      socket.emit('editarProduto', { idProduto, nome: novoNome, preco: novoPreco, descricao: novaDesc });
    }

    function toggleProduto(idProduto, statusNovo) {
      socket.emit('mudarStatusProduto', { idProduto, disponivel: statusNovo, ativo: statusNovo });
    }

    function excluirProduto(idProduto) {
      if (confirm("Deseja realmente excluir este produto?")) {
        socket.emit('excluirProduto', idProduto);
      }
    }

    function renderizarPedidos(pedidos) {
      const container = document.getElementById('container-pedidos');
      if (!pedidos || pedidos.length === 0) {
        container.innerHTML = '<p style="color: #777;">Nenhum pedido ativo no momento.</p>';
        return;
      }

      container.innerHTML = '';
      pedidos.forEach(p => {
        let itensTxt = p.itens ? p.itens.map(i => `${i.quantidade}x ${i.nome}`).join('<br>') : 'Sem itens';
        const statusTexto = (p.status || 'pendente').replace('_', ' ').toUpperCase();
        const idStr = String(p.id || '');

        container.innerHTML += `
          <div class="pedido-card ${p.status || 'pendente'}">
            <div class="pedido-header">
              <span>Pedido #${idStr ? idStr.slice(-4) : '---'} - ${p.cliente || 'Cliente'} (${p.data || ''})</span>
              <span>Status: <strong>${statusTexto}</strong></span>
            </div>
            <p><strong>Itens:</strong><br>${itensTxt}</p>
            <p style="margin-top:5px;"><strong>Total:</strong> R$ ${Number(p.total || 0).toFixed(2).replace('.', ',')} | <strong>Pagamento:</strong> ${(p.pagamento || '').toUpperCase()}</p>
            <p><strong>Entrega:</strong> ${p.endereco || 'Retirada / Balcão'}</p>
            ${p.whatsapp || p.telefone ? `<p><strong>WhatsApp:</strong> ${p.whatsapp || p.telefone}</p>` : ''}
            ${p.observacao ? `<p style="color: #d9534f;"><strong>Obs:</strong> ${p.observacao}</p>` : ''}
            
            <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="btn btn-imprimir" onclick="imprimirPedido('${idStr}')">🖨️ Imprimir 80mm / PDF</button>
              
              ${p.status === 'pendente' ? `
                <button class="btn btn-info" onclick="mudarStatusPedido('${idStr}', 'em_preparo')">👨‍🍳 Aceitar / Em Preparo</button>
              ` : ''}

              ${(p.status === 'pendente' || p.status === 'em_preparo') ? `
                <button class="btn btn-warning" onclick="notificarSaiuEntrega('${idStr}')">🛵 Saiu para Entrega</button>
              ` : ''}

              <button class="btn btn-danger" onclick="removerPedido('${idStr}')">✅ Concluir / Apagar</button>
            </div>
          </div>
        `;
      });
    }

    function mudarStatusPedido(id, status) {
      const pedido = pedidosAtuais.find(p => String(p.id) === String(id));
      if (pedido) {
        pedido.status = status;
        renderizarPedidos(pedidosAtuais);
      }
      socket.emit('alterarStatusPedido', { id, status });
    }

    function notificarSaiuEntrega(id) {
      const pedido = pedidosAtuais.find(p => String(p.id) === String(id));
      if (!pedido) return;

      pedido.status = 'saiu_entrega';
      renderizarPedidos(pedidosAtuais);
      socket.emit('alterarStatusPedido', { id, status: 'saiu_entrega' });
    }

    function removerPedido(id) {
      socket.emit('removerPedido', id);
    }
  </script>
